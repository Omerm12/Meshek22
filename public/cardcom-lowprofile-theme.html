<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תשלום מאובטח | משק 22</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand-600: #2e7d2e;
      --brand-700: #256225;
      --brand-50:  #f0fdf0;
      --surface:   #fdfcf9;
      --radius-xl: 1rem;
      --radius-2xl: 1.25rem;
    }

    html, body {
      direction: rtl;
      font-family: 'Rubik', 'Arial', sans-serif;
      background-color: var(--surface);
      color: #1c1917;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
    }

    /* ── Header ── */
    .site-header {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }

    .site-header img {
      height: 64px;
      width: auto;
      object-fit: contain;
      margin-bottom: 0.75rem;
    }

    .site-header .brand-name {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--brand-600);
      letter-spacing: -0.01em;
    }

    .site-header .page-title {
      font-size: 0.875rem;
      color: #78716c;
      margin-top: 0.25rem;
    }

    /* ── Payment card ── */
    .payment-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: var(--radius-2xl);
      padding: 1.75rem 1.5rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
    }

    .payment-card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #1c1917;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #f5f5f4;
    }

    /* CardCom injects the payment form here */
    #cardcom-form-container {
      width: 100%;
    }

    /* Override CardCom default inputs to match our design */
    #cardcom-form-container input[type="text"],
    #cardcom-form-container input[type="tel"],
    #cardcom-form-container input[type="number"],
    #cardcom-form-container select {
      width: 100%;
      height: 44px;
      padding: 0 0.875rem;
      border: 1px solid #d6d3d1;
      border-radius: var(--radius-xl);
      background: #ffffff;
      font-family: 'Rubik', 'Arial', sans-serif;
      font-size: 0.875rem;
      color: #1c1917;
      direction: ltr;
      transition: box-shadow 0.15s, border-color 0.15s;
      outline: none;
    }

    #cardcom-form-container input:focus,
    #cardcom-form-container select:focus {
      border-color: var(--brand-600);
      box-shadow: 0 0 0 3px rgba(46,125,46,.15);
    }

    #cardcom-form-container label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #44403c;
      margin-bottom: 0.375rem;
      direction: rtl;
      text-align: right;
    }

    #cardcom-form-container .form-group,
    #cardcom-form-container .field-group {
      margin-bottom: 1rem;
    }

    /* Submit button — override CardCom's default button */
    #cardcom-form-container input[type="submit"],
    #cardcom-form-container button[type="submit"],
    #cardcom-form-container .submit-btn,
    #cardcom-form-container .pay-button {
      display: block;
      width: 100%;
      height: 52px;
      margin-top: 1.5rem;
      padding: 0 1.5rem;
      background-color: var(--brand-600);
      color: #ffffff;
      font-family: 'Rubik', 'Arial', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      transition: background-color 0.15s;
      direction: rtl;
    }

    #cardcom-form-container input[type="submit"]:hover,
    #cardcom-form-container button[type="submit"]:hover,
    #cardcom-form-container .submit-btn:hover,
    #cardcom-form-container .pay-button:hover {
      background-color: var(--brand-700);
    }

    /* ── Trust footer ── */
    .trust-footer {
      margin-top: 1.5rem;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .trust-badges {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-size: 0.75rem;
      color: #a8a29e;
    }

    .trust-badges span {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .trust-badges .dot {
      width: 3px;
      height: 3px;
      background: #d6d3d1;
      border-radius: 50%;
    }

    .trust-footer .powered-by {
      font-size: 0.6875rem;
      color: #c4bdb6;
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .payment-card {
        padding: 1.25rem 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <img src="https://meshek22.co.il/images/heroes/logo.png" alt="משק 22" onerror="this.style.display='none'" />
    <span class="brand-name">משק 22</span>
    <span class="page-title">תשלום מאובטח</span>
  </header>

  <!-- Payment card — CardCom replaces the placeholder inside with the actual form -->
  <div class="payment-card">
    <h2>פרטי תשלום</h2>
    <div id="cardcom-form-container">
      <%FORM%>
    </div>
  </div>

  <!-- Trust footer -->
  <footer class="trust-footer">
    <div class="trust-badges">
      <span>🔒 SSL מאובטח</span>
      <span class="dot"></span>
      <span>Visa &amp; Mastercard</span>
      <span class="dot"></span>
      <span>תשלומים עד 12 תשלומים</span>
    </div>
    <p class="powered-by">מופעל על ידי CardCom — שירות סליקה מורשה</p>
  </footer>

</body>
</html>
